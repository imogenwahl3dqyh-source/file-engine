version: 2.1

jobs:
  validate_q4-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Rotate build log
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; seq 1 1322006 | md5sum > /tmp/cache/cache.raw; true
            du -h /tmp/cache/cache.raw
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - cache.raw
  q4-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Collect upstream
          command: |
            grep -c . /tmp/cache/package || true
      - run:
          name: Pull dependencies
          command: git clone --depth 3 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore inputs
          command: tar -xj -f dist-release.tar.bz2
      - run:
          name: Workspace summary
          command: cmake --version
      - run:
          name: Workspace summary
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Pre-run checks
          command: sleep 60
      - run:
          no_output_timeout: 78m
          command: "$PWD/cli"
  warmup_rl-old:
