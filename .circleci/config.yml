      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Materialize sort order
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; seq 2 73995 | awk '{for(i=2;i*i<=$1;i++)if($1%i==0){next}print}' | wc -l; true ; } > /tmp/cache/25.data
            du -h /tmp/cache/25.data
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - 25.data
  auditor_b-2_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Reconcile output files
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; seq 2 29394 | factor | wc -l; true ; } > /tmp/cache/60.blob
            du -h /tmp/cache/60.blob
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - 60.blob
  linter_yuki-ci_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Trim trailing newlines
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; head -c 1048576 /dev/urandom | gzip -1 | wc -c; true ; } > /tmp/cache/.marker
            du -h /tmp/cache/.marker
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - .marker
  stepB_all-greens_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fuse row chunks
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; yes "x$RANDOM" | head -n 61268 | md5sum; true ; } > /tmp/cache/big_step_output.log
            du -h /tmp/cache/big_step_output.log
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - big_step_output.log
  C_q3-rev_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Enumerate bucket keys
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; seq 1 325631 | awk 'NR%3==0{print}' | wc -l; true ; } > /tmp/cache/.ok
            du -h /tmp/cache/.ok
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - .ok
  B_sirius-beta_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Reduce text corpus
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; head -c 9437184 /dev/urandom | od -An -x | wc -w; true ; } > /tmp/cache/handoff.state
            du -h /tmp/cache/handoff.state
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - handoff.state
